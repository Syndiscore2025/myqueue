# DigitalOcean App Platform spec for MyQueue.
# Contains NO secret values — every secret is declared as `type: SECRET` with no
# value and must be set in the DO console (or via `doctl apps update`). Apply with:
#   doctl apps create --spec .do/app.yaml
#   doctl apps update <app-id> --spec .do/app.yaml
name: myqueue
region: nyc

domains:
  - domain: app.myqueue.syndiscore.com
    type: PRIMARY

databases:
  - name: myqueue-db
    engine: PG
    production: true
    version: "16"
  - name: myqueue-cache
    engine: VALKEY
    production: true

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: Syndiscore2025/myqueue
      branch: feat/phase-8-marketplace-readiness
      deploy_on_push: false
    dockerfile_path: Dockerfile.migrate
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        value: ${myqueue-db.DATABASE_URL}

services:
  - name: web
    github:
      repo: Syndiscore2025/myqueue
      branch: feat/phase-8-marketplace-readiness
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /ready
      initial_delay_seconds: 30
      period_seconds: 10
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: APP_BASE_URL
        value: https://app.myqueue.syndiscore.com
      - key: CORS_ORIGINS
        value: https://app.myqueue.syndiscore.com
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        value: ${myqueue-db.DATABASE_URL}
      - key: REDIS_URL
        value: ${myqueue-cache.DATABASE_URL}
      - key: ENCRYPTION_KEY
        type: SECRET
      - key: AUTH_TOKEN_SECRET
        type: SECRET
      - key: SLACK_CLIENT_ID
        type: SECRET
      - key: SLACK_CLIENT_SECRET
        type: SECRET
      - key: SLACK_SIGNING_SECRET
        type: SECRET
      - key: SLACK_STATE_SECRET
        type: SECRET

workers:
  - name: worker
    github:
      repo: Syndiscore2025/myqueue
      branch: feat/phase-8-marketplace-readiness
      deploy_on_push: false
    dockerfile_path: Dockerfile
    run_command: node dist/workers/index.js
    instance_count: 1
    instance_size_slug: basic-xs
    envs:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: ${myqueue-db.DATABASE_URL}
      - key: REDIS_URL
        value: ${myqueue-cache.DATABASE_URL}
      - key: ENCRYPTION_KEY
        type: SECRET
      - key: AUTH_TOKEN_SECRET
        type: SECRET
      - key: SLACK_CLIENT_ID
        type: SECRET
      - key: SLACK_CLIENT_SECRET
        type: SECRET
      - key: SLACK_SIGNING_SECRET
        type: SECRET
      - key: SLACK_STATE_SECRET
        type: SECRET
