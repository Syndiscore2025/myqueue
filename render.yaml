# Render Blueprint for MyQueue.
#
# Provisions the full stack in one deploy:
#   - managed PostgreSQL (myqueue-db)
#   - managed Key Value / Redis (myqueue-cache)
#   - API web service (Docker) with pre-deploy schema migrations
#   - background worker (Docker)
#
# Secrets are declared `sync: false` (no values committed) and entered once in
# the Render dashboard for the shared env group. Datastore URLs are wired
# automatically via fromDatabase / fromService — no connection strings handled
# by hand. Deploy from the Render dashboard: New > Blueprint > select this repo.

databases:
  - name: myqueue-db
    databaseName: myqueue
    user: myqueue
    plan: basic_256mb
    region: virginia
    postgresMajorVersion: "16"
    # Internal connections only; the app reaches it over Render's private network.
    ipAllowList: []

services:
  # ----- Key Value (Redis-compatible) store for BullMQ + rate limiting --------
  - type: keyvalue
    name: myqueue-cache
    plan: starter
    region: virginia
    # BullMQ requires keys are never evicted out from under it.
    maxmemoryPolicy: noeviction
    # Internal connections only.
    ipAllowList: []

  # ----- API (HTTP) -----------------------------------------------------------
  - type: web
    name: myqueue-api
    runtime: docker
    region: virginia
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    # Apply schema migrations before the new version receives traffic.
    preDeployCommand: npx prisma migrate deploy
    domains:
      - app.myqueue.syndiscore.com
    envVars:
      - fromGroup: myqueue-shared
      - key: APP_BASE_URL
        value: https://app.myqueue.syndiscore.com
      - key: CORS_ORIGINS
        value: https://app.myqueue.syndiscore.com
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: myqueue-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: myqueue-cache
          property: connectionString

  # ----- Background worker (BullMQ + scheduler loops) -------------------------
  - type: worker
    name: myqueue-worker
    runtime: docker
    region: virginia
    plan: starter
    dockerfilePath: ./Dockerfile
    # Override the image's API entrypoint with the worker process.
    dockerCommand: node dist/workers/index.js
    envVars:
      - fromGroup: myqueue-shared
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: myqueue-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: myqueue-cache
          property: connectionString

# Shared config + secrets used by both the API and the worker. In production the
# env schema requires the Slack credentials and AUTH_TOKEN_SECRET for EVERY
# process, so the worker carries them too. Enter the sync:false values once in
# the dashboard for this group.
envVarGroups:
  - name: myqueue-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENCRYPTION_KEY
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_STATE_SECRET
        sync: false
